aid: australiansuper

name: AustralianSuper

description: AustralianSuper is an Australian industry superannuation (retirement savings) fund headquartered in Melbourne, run on a profit-for-member basis with no dividends paid to shareholders, and described as the largest superannuation fund in Australia with membership open to all Australians. Its plans include the AustralianSuper Plan for employees and a Personal Plan, with investment options such as the MySuper-authorised Balanced option, PreMixed and DIY Mix options, and Member Direct. Surfaced via the API Evangelist harvest backlog (australia-apidays-2026); no public developer portal or API documentation was found, and its website refused automated access (Akamai 403).

